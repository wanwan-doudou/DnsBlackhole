[package]
name = "dnsblackhole"
version = "0.2.4"
description = "本地 DNS 黑名单工具"
authors = ["doudou"]
edition = "2024"
default-run = "dnsblackhole"

[lib]
name = "dnsblackhole_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
macos-service = []
# 只给 criterion 基准打开：暴露 DNS 热路径的公开门面，不影响正式构建。
bench = []

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
socket2 = "0.6"
reqwest = { version = "0.13", features = ["blocking"] }
hickory-net = { version = "0.26.1", features = [
    "https-ring",
    "quic-ring",
    "tls-ring",
    "webpki-roots",
] }
futures-util = "0.3.34"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time"] }
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-opener = "2.5.5"
tauri-plugin-dialog = "2.7.3"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSError", "NSString"] }
objc2-service-management = { version = "0.3.2", features = ["objc2", "objc2-foundation", "SMAppService"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56"

[[bin]]
name = "dnsblackhole"
path = "src/main.rs"

[[bin]]
name = "dnsblackhole-service"
path = "src/bin/dnsblackhole-service.rs"
required-features = ["macos-service"]

[[bench]]
name = "dns_hot_path"
harness = false
required-features = ["bench"]

# DNS 转发是热路径，跨 crate 内联收益明显；codegen-units=1 配合 thin LTO 换取运行时吞吐。
#
# 用 thin 而不是 fat：fat LTO 的链接阶段是单线程全量重编译，本机实测会让 release
# 构建多花十几分钟且期间无任何日志输出，日常验证成本太高；thin LTO 保留了绝大部分
# 跨 crate 内联收益，链接时间只有 fat 的零头。
#
# 不设置 panic = "abort"：task_pool 依赖 catch_unwind 兜住单个上游任务的 panic，
# 改为 abort 会让一次任务 panic 直接终止整个进程。
#
# 只想快速出一个本地验证包时，用环境变量临时关掉即可，无需改动本文件：
#   $env:CARGO_PROFILE_RELEASE_LTO="false"; $env:CARGO_PROFILE_RELEASE_CODEGEN_UNITS="16"
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
