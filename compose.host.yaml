name: dnsblackhole

services:
  dnsblackhole:
    build:
      context: .
    image: ${DNSBLACKHOLE_IMAGE:-ghcr.io/wanwan-doudou/dnsblackhole:0.2.5}
    restart: unless-stopped
    network_mode: host
    environment:
      DNSBLACKHOLE_CONTAINER: "1"
    volumes:
      - dnsblackhole-data:/var/lib/dnsblackhole
    tmpfs:
      - /run/dnsblackhole:mode=0755,uid=10001,gid=10001
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    stop_grace_period: 20s

volumes:
  dnsblackhole-data:
