name: Windows CI

on:
  push:
    branches: [main, "agent/**", "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: 构建、测试与静态检查
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust 依赖安全审计
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-ci

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 前端类型检查与构建
        run: pnpm build

      - name: 前端单元测试
        run: pnpm test

      - name: 英文字典覆盖检查
        run: python scripts/check-i18n.py

      - name: Rust 格式检查
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust 单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # 共享 CI 机器噪声太大，无法做真正的性能门禁；这里只保证基准始终可编译，
      # 避免热路径重构后基准悄悄失效。实际性能对比在本地跑：
      # cargo bench --manifest-path src-tauri/Cargo.toml --features bench --bench dns_hot_path
      - name: 性能基准编译检查
        run: cargo bench --manifest-path src-tauri/Cargo.toml --features bench --bench dns_hot_path --no-run
