# 一次性恢复流程：只把 updater 私钥加密给本机临时公钥，不输出明文。
name: Recover Updater Key

on:
  workflow_dispatch:

permissions: {}

jobs:
  recover:
    name: 加密 updater 私钥
    runs-on: windows-latest
    steps:
      - name: 生成本机专用的加密载荷
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "仓库未配置 TAURI_SIGNING_PRIVATE_KEY"
          }

          $publicKeyBase64 = ""
          $publicKeyBytes = [Convert]::FromBase64String($publicKeyBase64)
          $bytesRead = 0
          $rsa = [Security.Cryptography.RSA]::Create()
          $aes = [Security.Cryptography.Aes]::Create()
          try {
            $rsa.ImportSubjectPublicKeyInfo($publicKeyBytes, [ref]$bytesRead)
            if ($bytesRead -ne $publicKeyBytes.Length) {
              throw "恢复公钥格式不正确"
            }

            $aes.KeySize = 256
            $aes.Mode = [Security.Cryptography.CipherMode]::CBC
            $aes.Padding = [Security.Cryptography.PaddingMode]::PKCS7
            $aes.GenerateKey()
            $aes.GenerateIV()

            $plaintext = [Text.UTF8Encoding]::new($false).GetBytes(
              $env:TAURI_SIGNING_PRIVATE_KEY.Trim()
            )
            $encryptor = $aes.CreateEncryptor()
            try {
              $ciphertext = $encryptor.TransformFinalBlock($plaintext, 0, $plaintext.Length)
            }
            finally {
              $encryptor.Dispose()
            }
            $wrappedKey = $rsa.Encrypt(
              $aes.Key,
              [Security.Cryptography.RSAEncryptionPadding]::OaepSHA256
            )
            $payload = [ordered]@{
              version     = 1
              length      = $plaintext.Length
              sha256      = [Convert]::ToHexString(
                [Security.Cryptography.SHA256]::HashData($plaintext)
              ).ToLowerInvariant()
              wrapped_key = [Convert]::ToBase64String($wrappedKey)
              iv          = [Convert]::ToBase64String($aes.IV)
              ciphertext  = [Convert]::ToBase64String($ciphertext)
            } | ConvertTo-Json
            [IO.File]::WriteAllText(
              (Join-Path $env:RUNNER_TEMP "updater-key-recovery.json"),
              $payload,
              [Text.UTF8Encoding]::new($false)
            )
          }
          finally {
            $aes.Dispose()
            $rsa.Dispose()
          }

      - name: 上传加密载荷
        uses: actions/upload-artifact@v6
        with:
          name: updater-key-recovery
          path: ${{ runner.temp }}/updater-key-recovery.json
          if-no-files-found: error
          retention-days: 1
